# Each question is asked when at least one pattern in `informs` is still plausible
# after inspection. Effects exist only where the 2016 consensus names that sign.
# Bitter taste, limb heaviness, and cycle timing are collected for the workup
# and do not change the score.
questions:
  - id: onset_speed
    informs: [wind_heat]
    prompt: "Did this flare start quickly, over hours or a few days, or did the rash build gradually?"
    options:
      - id: sudden
        label: "It started quickly"
        effects:
          - {pattern: wind_heat, weight: 2, source: consensus-2016, statement: "A fast onset fits wind-heat in the skin, which the consensus places at the start of acute eczema or in an acute flare."}
      - id: gradual
        label: "It built gradually"
        effects:
          - {pattern: wind_heat, weight: -1, source: consensus-2016, statement: "A gradual onset counts against wind-heat in the skin, which is described as a fast acute pattern."}
      - id: unknown
        label: "Not sure"
        effects: []

  - id: fever
    informs: [wind_heat]
    prompt: "With the flare, has there been a fever?"
    options:
      - id: "yes"
        label: "Yes"
        effects:
          - {pattern: wind_heat, weight: 2, source: consensus-2016, statement: "Fever is listed with wind-heat in the skin."}
      - id: "no"
        label: "No"
        effects:
          - {pattern: wind_heat, weight: -1, source: consensus-2016, statement: "Fever was absent. The consensus lists fever as a possible sign of wind-heat in the skin."}
      - id: unknown
        label: "Not sure"
        effects: []

  - id: thirst
    informs: [wind_heat, damp_heat]
    prompt: "During a flare, are you noticeably thirsty?"
    options:
      - id: "yes"
        label: "Yes"
        effects:
          - {pattern: wind_heat, weight: 2, source: consensus-2016, statement: "Thirst is listed with wind-heat in the skin."}
          - {pattern: damp_heat, weight: 2, source: consensus-2016, statement: "Thirst is listed with damp-heat immersion."}
      - id: "no"
        label: "No"
        effects:
          - {pattern: wind_heat, weight: -1, source: consensus-2016, statement: "Thirst was absent. The consensus lists thirst with wind-heat in the skin."}
          - {pattern: damp_heat, weight: -1, source: consensus-2016, statement: "Thirst was absent. The consensus lists thirst with damp-heat immersion."}
      - id: unknown
        label: "Not sure"
        effects: []

  - id: restlessness
