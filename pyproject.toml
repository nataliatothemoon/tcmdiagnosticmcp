[project]
name = "tcm-eczema-mcp"
version = "0.1.0"
description = "Local MCP for de-identified traditional Chinese medicine eczema case studies."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tcm-eczema-mcp = "tcm_eczema_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
